plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-1.21.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// ModDev's 1.21.1 development run loads the mod source output directly and
// does not add the project dependency's classes to that runtime classpath.
sourceSets.main.output.dir(
        project(':common').layout.buildDirectory.dir('classes/java/main'),
        builtBy: ':common:classes'
)

// Development-only client test source set. It is compiled as a second mod
// ("jeieditortests") that only the "clientTest" run loads, so the published jar
// - which is built from sourceSets.main - can never contain it.
sourceSets.create('clientTest')

neoForge {
    version = neoforge_121_version

    // The client test source set is the classpath of a real run, so it needs
    // the same Minecraft/NeoForge dependencies as the main source set.
    addModdingDependenciesTo(sourceSets.clientTest)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }

        // Development-only second mod: the JEI client test suite.
        jeieditortests {
            sourceSet(sourceSets.clientTest)
        }
    }

    runs {
        client {
            client()
            loadedMods.set([mods.getByName(mod_id)])
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods.set([mods.getByName(mod_id)])
        }
        clientTest {
            client()
            // The editor has to be loaded for its adapters to run; the test
            // mod is the second, development-only mod.
            loadedMods.set([mods.getByName(mod_id), mods.getByName('jeieditortests')])
            // Its own game directory keeps options, config and worlds away
            // from the normal client run.
            sourceSet.set(sourceSets.clientTest)
            gameDirectory.set(file('run/clientTest'))
            programArguments.addAll('--username', 'JEIClientTest')
            systemProperty 'jeieditortests.report',
                    project.layout.buildDirectory.file('client-test/report.json').get().asFile.absolutePath
            systemProperty 'jeieditortests.wiredPages',
                    project.layout.buildDirectory.file('client-test/wired-pages.txt').get().asFile.absolutePath
            systemProperty 'jeieditortests.progress',
                    project.layout.buildDirectory.file('client-test/progress.txt').get().asFile.absolutePath
        }
    }

}

repositories {
    // Gradle's JVM currently resets the NeoForge Maven TLS connection in this environment.
    // Keep the exact upstream 21.1.238 artifacts available to reproducible local builds.
    maven {
        name = 'NeoForgeLocalMirror'
        url = uri('../../.maven-mirror')
    }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation project(':common')

    // The client tests compile against the editor's own classes (and the
    // shared common classes) and against JEI.
    clientTestImplementation sourceSets.main.output
    clientTestImplementation project(':common')
    clientTestImplementation "cc.sighs.modrinthmirror:jei:${jei_modrinth_version}"

    // The fixed test pack lives in the normal run's mods folder. The test run
    // has its own game directory, so it reads those jars from its classpath
    // instead of the game directory.
    clientTestRuntimeOnly fileTree('run/mods') { include '*.jar' }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: neoforge_121_minecraft_version,
            neoforge_version: neoforge_121_version,
            neoforge_version_range: neoforge_121_version_range,
            jei_version: jei_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from project(':common').sourceSets.main.output
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: file('../../gradle/target-conventions/publish.gradle')

// ---------------------------------------------------------------------------
// Development-only simulation run (AutoJS).
//
// Mirrors the normal client but additionally puts KubeJS and the AutoJS debug
// MCP on the runtime classpath, in its own game directory, so the verified
// "run/" environment stays untouched. KubeJS is normally disabled in run/mods
// because it competes with the editor over JEI visibility - having it loaded is
// a known variable of anything measured in this run.
// See build/tmp/jei-sim/setup.md.
sourceSets.create('sim')

neoForge.addModdingDependenciesTo(sourceSets.sim)

neoForge.runs.create('sim') {
    client()
    loadedMods.set([neoForge.mods.getByName(mod_id)])
    sourceSet.set(sourceSets.sim)
    gameDirectory.set(file('run-sim'))
    programArguments.addAll('--username', 'SimPlayer')
}

dependencies {
    simImplementation sourceSets.main.output
    simImplementation project(':common')
    simImplementation "cc.sighs.modrinthmirror:jei:${jei_modrinth_version}"

    // The fixed test pack lives in the normal run's mods folder; this run has
    // its own game directory, so it reads those jars from its classpath.
    simRuntimeOnly fileTree('run/mods') { include '*.jar' }

    // KubeJS is required by AutoJS (versionRange "[2101,)"; the disabled 377
    // file satisfies it) and rhino, its own dependency, is already in the pack.
    simRuntimeOnly files('run/mods/kubejs__kubejs-neoforge-2101.7.2-build.377.jar.disabled')
    // AutoJS is a sibling checkout at D:\work\AutoJS: this project directory is
    // targets/neoforge-1.21.1, so the sibling is three levels up. Gradle keeps a
    // files() entry that does not exist without complaining, so a wrong depth
    // here is silent - the client simply boots without the mod.
    simRuntimeOnly files('../../../AutoJS/targets/neoforge-1.21.1/build/libs/AutoJS-neoforge-1.21.1-1.0.0.jar')
}
